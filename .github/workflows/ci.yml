name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check (format, lint, types)
        run: bun run check

      # The 100% coverage gate: fails on any threshold shortfall.
      - name: Test with coverage
        run: bunx vitest run --coverage.enabled
